# Twin of p5_unet_ctfm_k2, differing only in the CT that goes into CT-FM: the native-resolution
# CT of data/ct_native/v1 (4 x 4 CT pixels per PET pixel, ~1 mm, clipped at CT-FM's window
# [-1024, 2048]) instead of the ~4 mm CT on the PET grid clipped at +-1000. Same slab, same PET
# field of view, same training. Compare against p5_unet_ctfm_k2 and p4_unet_noct_k2.
exp_id: p5_unet_ctfm_native_k2
k: 2
processed: data/processed/v1
degraded: data/degraded/v1
ct_native: data/ct_native/v1           # p5_ct_native_v1
split_file: split_v1.json
subset: test
bladder_label: 21                     # TotalSegmentator urinary_bladder, in organs.nii.gz
data:
  suv_ref: 50                         # PET -> log(1+SUV)/log(1+50); absolute, never min-max
  ct_hu: [-1000, 1000]                # CT -> [-1, 1]
model:
  name: unet25d_ctfm
  use_ct: true
  pet_context: 2                      # thick PET slices on each side of the target block
  ct_slab: 16                         # thin CT slices centred on the block; CT-FM halves z 4 times
  ctfm:
    repo: project-lighter/ct_fm_feature_extractor
    revision: 527b0d1c262b433396c85ff2de84c427b26945a1   # pinned Hugging Face commit, 2025-02-24
    hu: [-1024, 2048]                 # CT-FM's own HU window -> [0, 1]
    ct_scale: 4                       # CT pixels per PET pixel in-plane, as ct_native/v1's factor
  features: [32, 64, 128, 256, 512, 32]   # MONAI BasicUNet, 7.8M parameters
  norm: batch                         # not instance: inference sees whole slices, training 192 crops
loss:
  w_msssim: 0.84
  w_l1: 0.16
  lesion_weight: 5                    # L1 weight on TTB voxels (guardrail: 5-10x)
  data_range: 1.0                     # in log-SUV units, SUV 50 -> 1.0
train:
  seed: 20261011
  patch: 192                          # in-plane crop; 5-scale MS-SSIM needs > 160
  batch: 16
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 50                          # cosine decay to 0 over all epochs
  steps_per_epoch: 500                # an epoch = 8000 random blocks, about 0.6 passes at k=2
  val_stride: 4                       # validate on every 4th block of each val patient
  workers: 2                          # Colab standard runtime has 2 CPUs
  max_session_hours: 11
eval:
  checkpoint: best                    # lowest validation loss
  batch: 8                            # the 3D encoder on whole 16-slice slabs; 32 risks OOM
