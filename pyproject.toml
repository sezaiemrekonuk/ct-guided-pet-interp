[project]
name = "petinterp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "SimpleITK", "pyyaml", "requests"]

[project.optional-dependencies]
train = ["torch", "monai", "pytorch-msssim"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
